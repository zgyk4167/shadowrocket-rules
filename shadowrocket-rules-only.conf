# DMIT 规则订阅（一个 URL 下载所有规则）
# 用法：Shadowrocket → 配置 → 右上角 + → 粘贴本文件 URL → 下载 → 使用
# 说明：本配置只含规则，不含节点。节点请用首页 Subscribe 订阅（sr-subscribe.txt）
# 规则：广告拦截 → 国内直连 → 国外代理 → 国内IP兜底 → 其余走代理

[General]
loglevel = notify
ipv6 = false
dns-server = https://doh.pub/dns-query,https://dns.alidns.com/dns-query,223.5.5.5

